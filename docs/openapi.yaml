openapi: 3.0.3
info:
  title: EventSphere API
  version: "1.0.0"
  description: |
    Swagger test documentation for the EventSphere REST API.

    Source of truth: current Express routers, controllers, Joi DTOs and Mongoose models.
    JSON responses normally use `{ success, message, data, error }`.
    Exceptions: attendee CSV export returns `text/csv`; VNPay return renders an HTML result page;
    VNPay IPN returns VNPay response codes.

servers:
  - url: /api/v1
    description: Same host as the running server
  - url: http://localhost:3000/api/v1
    description: Local development

tags:
  - name: Authentication
    description: Dang ky, dang nhap va quan ly phien dang nhap
  - name: Events
    description: Xem, tim kiem va quan ly su kien
  - name: Tickets
    description: Dang ky tham du, xem ve va lich su ve
  - name: Payments
    description: Thanh toan ve qua VNPay
  - name: Reviews
    description: Danh gia su kien
  - name: Notifications
    description: Gui va xem lich su thong bao
  - name: Check-in
    description: Check-in bang QR hoac thu cong
  - name: Organizer
    description: Quan ly su kien, loai ve, nhan vien va bao cao
  - name: Admin
    description: Duyet su kien, quan ly tai khoan va thong ke he thong

paths:
  /auth/register:
    post:
      summary: Dang ky tai khoan
      description: API cong khai de tao tai khoan moi. Role neu khong gui se mac dinh la attendee.
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterBody"
            example:
              name: "Vo Chi Trong"
              email: "attendee1@gmail.com"
              password: "123456"
              role: attendee
              phone: "0900000006"
      responses:
        "201":
          description: Dang ky thanh cong
        "400":
          description: Du lieu dau vao khong hop le
        "500":
          description: Loi he thong

  /auth/login:
    post:
      summary: Dang nhap
      description: API cong khai tra ve accessToken va refreshToken khi email/password hop le.
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginBody"
            example:
              email: "attendee1@gmail.com"
              password: "123456"
      responses:
        "200":
          description: Dang nhap thanh cong
        "400":
          description: Du lieu dau vao khong hop le
        "401":
          description: Sai thong tin dang nhap hoac token khong hop le
        "403":
          description: Tai khoan bi khoa
        "500":
          description: Loi he thong

  /auth/logout:
    post:
      summary: Dang xuat
      description: "Role yeu cau: user da dang nhap. Thu hoi refresh token."
      tags: [Authentication]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        "200":
          description: Dang xuat thanh cong
        "401":
          description: Chua dang nhap hoac token khong hop le
        "500":
          description: Loi he thong

  /auth/verify-email:
    get:
      summary: Xac thuc email
      description: API cong khai duoc goi tu link email verification.
      tags: [Authentication]
      parameters:
        - in: query
          name: token
          required: true
          schema:
            type: string
          description: Token xac thuc email trong link gui qua email
      responses:
        "200":
          description: Xac thuc email thanh cong
        "400":
          description: Token khong hop le hoac da het han
        "500":
          description: Loi he thong

  /auth/forgot-password:
    post:
      summary: Gui email quen mat khau
      description: API cong khai gui email reset password neu email hop le.
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
            example:
              email: "attendee1@gmail.com"
      responses:
        "200":
          description: Da xu ly yeu cau quen mat khau
        "400":
          description: Email khong hop le
        "500":
          description: Loi he thong

  /auth/reset-password:
    post:
      summary: Dat lai mat khau
      description: API cong khai dat lai mat khau bang token reset. Source hien tai nhan token tu query hoac service tuy controller.
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password, confirmPassword]
              properties:
                token:
                  type: string
                password:
                  type: string
                  minLength: 6
                  maxLength: 30
                  format: password
                confirmPassword:
                  type: string
                  format: password
            example:
              token: "reset-token-from-email"
              password: "123456"
              confirmPassword: "123456"
      responses:
        "200":
          description: Dat lai mat khau thanh cong
        "400":
          description: Du lieu dau vao khong hop le
        "500":
          description: Loi he thong

  /auth/me:
    get:
      summary: Lay thong tin ca nhan
      description: "Role yeu cau: user da dang nhap."
      tags: [Authentication]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Lay thong tin ca nhan thanh cong
        "401":
          description: Chua dang nhap hoac token khong hop le
        "403":
          description: Tai khoan bi khoa
        "500":
          description: Loi he thong
    patch:
      summary: Cap nhat thong tin ca nhan
      description: "Role yeu cau: user da dang nhap. Chi chap nhan name, phone, avatar."
      tags: [Authentication]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileBody"
            example:
              name: "Le Hoang Nam"
              phone: "0900000006"
              avatar: "https://i.pravatar.cc/150?img=31"
      responses:
        "200":
          description: Cap nhat thong tin ca nhan thanh cong
        "400":
          description: Du lieu dau vao khong hop le
        "401":
          description: Chua dang nhap hoac token khong hop le
        "403":
          description: Tai khoan bi khoa
        "500":
          description: Loi he thong

  /auth/change-password:
    patch:
      summary: Doi mat khau
      description: "Role yeu cau: user da dang nhap."
      tags: [Authentication]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordBody"
      responses:
        "200":
          description: Doi mat khau thanh cong
        "400":
          description: Du lieu dau vao khong hop le
        "401":
          description: Chua dang nhap hoac token khong hop le
        "500":
          description: Loi he thong

  /events:
    get:
      summary: Lay danh sach hoac loc su kien cong khai
      description: UC01/UC04. API cong khai. Neu co category/startFrom/startTo thi source chay filter mode.
      tags: [Events]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - in: query
          name: category
          schema:
            type: string
            enum: [music, tech, sport, education]
          description: Loc theo danh muc su kien
        - in: query
          name: startFrom
          schema:
            type: string
            format: date
          description: Ngay bat dau tu
        - in: query
          name: startTo
          schema:
            type: string
            format: date
          description: Ngay bat dau den
      responses:
        "200":
          description: Lay danh sach su kien thanh cong
        "400":
          description: Query khong hop le
        "500":
          description: Loi he thong
    post:
      summary: Tao su kien
      description: "UC13. Role yeu cau: organizer hoac admin. Ho tro JSON hoac multipart/form-data voi file field `banner`."
      tags: [Organizer]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEventBody"
            example:
              title: "Hoi thao Cong nghe 2026"
              description: "Mo ta chi tiet su kien lon hon 10 ky tu"
              category: tech
              location: "Trung tam Hoi nghi"
              startDate: "2026-08-01T08:00:00.000Z"
              endDate: "2026-08-01T17:00:00.000Z"
              bannerUrl: "https://picsum.photos/seed/es-new/900/500"
              actionType: draft
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/CreateEventMultipartBody"
      responses:
        "201":
          description: Tao su kien thanh cong
        "400":
          description: Du lieu dau vao khong hop le
        "401":
          description: Chua dang nhap
        "403":
          description: Khong co quyen Organizer
        "500":
          description: Loi he thong

  /events/search:
    get:
      summary: Tim kiem su kien
      description: UC03. API cong khai tim kiem theo query `q`.
      tags: [Events]
      parameters:
        - in: query
          name: q
          required: true
          schema:
            type: string
          description: Tu khoa tim kiem
          example: "Su kien cong nghe"
      responses:
        "200":
          description: Tim kiem su kien thanh cong
        "400":
          description: Query khong hop le
        "500":
          description: Loi he thong

  /events/my:
    get:
      summary: Lay danh sach su kien cua organizer
      description: "UC13. Role yeu cau: organizer hoac admin."
      tags: [Organizer]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Lay danh sach su kien cua organizer thanh cong
        "401":
          description: Chua dang nhap
        "403":
          description: Khong co quyen Organizer
        "500":
          description: Loi he thong

  /events/{id}:
    get:
      summary: Lay chi tiet su kien
      description: UC02. API cong khai lay chi tiet su kien theo MongoDB ObjectId.
      tags: [Events]
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Lay chi tiet su kien thanh cong
        "400":
          description: Path parameter khong hop le
        "404":
          description: Khong tim thay su kien
        "500":
          description: Loi he thong
    put:
      summary: Cap nhat su kien
      description: "UC13. Role yeu cau: organizer hoac admin. Source chi cho owner sua event o trang thai DRAFT."
      tags: [Organizer]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEventBody"
            example:
              title: "Hoi thao Cong nghe 2026 - Updated"
              location: "FPT Can Tho"
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/UpdateEventMultipartBody"
      responses:
        "200":
          description: Cap nhat su kien thanh cong
        "400":
          description: Du lieu dau vao khong hop le
        "401":
          description: Chua dang nhap
        "403":
          description: Khong co quyen hoac trang thai khong cho sua
        "404":
          description: Khong tim thay su kien
        "500":
          description: Loi he thong
    delete:
      summary: Xoa su kien
      description: "UC13. Role yeu cau: organizer hoac admin. Source chi cho xoa event DRAFT hoac REJECTED."
      tags: [Organizer]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Xoa su kien thanh cong
        "400":
          description: Path parameter khong hop le
        "401":
          description: Chua dang nhap
        "403":
          description: Khong co quyen hoac trang thai khong cho xoa
        "404":
          description: Khong tim thay su kien
        "500":
          description: Loi he thong

  /events/{id}/submit:
    patch:
      summary: Gui su kien di duyet
      description: "UC13. Role yeu cau: organizer hoac admin. Chuyen DRAFT sang PENDING."
      tags: [Organizer]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Gui duyet thanh cong
        "400":
          description: Trang thai khong hop le
        "401":
          description: Chua dang nhap
        "403":
          description: Khong co quyen Organizer
        "404":
          description: Khong tim thay su kien
        "500":
          description: Loi he thong

  /events/{id}/cancel:
    patch:
      summary: Huy yeu cau duyet su kien
      description: "UC13. Role yeu cau: organizer hoac admin. Source chuyen PENDING ve DRAFT."
      tags: [Organizer]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Huy yeu cau duyet thanh cong
        "400":
          description: Trang thai khong hop le
        "401":
          description: Chua dang nhap
        "403":
          description: Khong co quyen Organizer
        "404":
          description: Khong tim thay su kien
        "500":
          description: Loi he thong

  /events/{id}/staffs:
    post:
      summary: Phan cong nhan vien check-in
      description: "UC17. Role yeu cau: organizer hoac admin. Body email phai thuoc user role staff."
      tags: [Organizer]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
            example:
              email: "staff1@eventsphere.vn"
      responses:
        "201":
          description: Them nhan vien thanh cong
        "400":
          description: Du lieu dau vao khong hop le
        "401":
          description: Chua dang nhap
        "403":
          description: Khong co quyen Organizer
        "404":
          description: Khong tim thay su kien hoac staff
        "500":
          description: Loi he thong

  /events/{id}/staffs/{staffId}:
    delete:
      summary: Go nhan vien check-in khoi su kien
      description: "UC17. Role yeu cau: organizer hoac admin."
      tags: [Organizer]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
        - in: path
          name: staffId
          required: true
          schema:
            $ref: "#/components/schemas/ObjectId"
          description: MongoDB ObjectId cua staff assignment hoac staff theo repository source
      responses:
        "200":
          description: Xoa nhan vien khoi su kien thanh cong
        "400":
          description: Path parameter khong hop le
        "401":
          description: Chua dang nhap
        "403":
          description: Khong co quyen Organizer
        "404":
          description: Khong tim thay su kien
        "500":
          description: Loi he thong

  /events/{id}/registrations:
    get:
      summary: Lay danh sach dang ky cua su kien
      description: "UC15. Role yeu cau: organizer hoac admin. Organizer chi xem su kien cua minh."
      tags: [Organizer]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
        - $ref: "#/components/parameters/Page"
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            default: 20
          description: So ban ghi moi trang
      responses:
        "200":
          description: Lay danh sach dang ky thanh cong
        "400":
          description: Query hoac path parameter khong hop le
        "401":
          description: Chua dang nhap
        "403":
          description: Khong co quyen xem danh sach dang ky
        "404":
          description: Khong tim thay su kien
        "500":
          description: Loi he thong

  /events/{id}/export:
    get:
      summary: Xuat danh sach attendee CSV
      description: "UC18. Role yeu cau: organizer hoac admin. Endpoint tra ve file CSV, khong tra JSON."
      tags: [Organizer]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Xuat danh sach nguoi tham du thanh cong
          content:
            text/csv:
              schema:
                type: string
                format: binary
        "400":
          description: Path parameter khong hop le
        "401":
          description: Chua dang nhap
        "403":
          description: Khong co quyen Organizer
        "404":
          description: Khong tim thay su kien
        "500":
          description: Loi he thong

  /events/{id}/report:
    get:
      summary: Xem bao cao tong ket su kien
      description: "UC19. Role yeu cau: organizer. Source chi cho owner xem va chi kha dung khi event da ENDED."
      tags: [Organizer]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Lay bao cao su kien thanh cong
        "400":
          description: Su kien chua ket thuc hoac ID khong hop le
        "401":
          description: Chua dang nhap
        "403":
          description: Khong co quyen Organizer hoac khong phai owner
        "404":
          description: Khong tim thay su kien
        "500":
          description: Loi he thong

  /events/{id}/dashboard:
    get:
      summary: Lay snapshot dashboard check-in
      description: "UC20 REST snapshot. Role yeu cau: organizer. Socket.io realtime dung event `join_event` va server emit `checkin_update` theo room eventId."
      tags: [Organizer]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Lay dashboard snapshot thanh cong
        "400":
          description: Path parameter khong hop le
        "401":
          description: Chua dang nhap
        "403":
          description: Khong co quyen Organizer
        "404":
          description: Khong tim thay su kien
        "500":
          description: Loi he thong

  /events/{eventId}/ticket-types:
    get:
      summary: Lay danh sach loai ve cua su kien
      description: UC14. API cong khai xem ticket types cua event.
      tags: [Events]
      parameters:
        - $ref: "#/components/parameters/EventIdPath"
      responses:
        "200":
          description: Lay danh sach loai ve thanh cong
        "400":
          description: Path parameter khong hop le
        "404":
          description: Khong tim thay su kien
        "500":
          description: Loi he thong
    post:
      summary: Tao loai ve
      description: "UC14. Role yeu cau: organizer hoac admin."
      tags: [Organizer]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/EventIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TicketTypeBody"
            example:
              name: "General"
              price: 0
              quota: 100
              description: "Ve mien phi"
      responses:
        "201":
          description: Tao loai ve thanh cong
        "400":
          description: Du lieu dau vao khong hop le
        "401":
          description: Chua dang nhap
        "403":
          description: Khong co quyen Organizer
        "404":
          description: Khong tim thay su kien
        "500":
          description: Loi he thong

  /events/{eventId}/ticket-types/{id}:
    put:
      summary: Cap nhat loai ve
      description: "UC14. Role yeu cau: organizer hoac admin."
      tags: [Organizer]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/EventIdPath"
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTicketTypeBody"
            example:
              price: 450000
              quota: 30
      responses:
        "200":
          description: Cap nhat loai ve thanh cong
        "400":
          description: Du lieu dau vao khong hop le
        "401":
          description: Chua dang nhap
        "403":
          description: Khong co quyen Organizer
        "404":
          description: Khong tim thay loai ve
        "500":
          description: Loi he thong
    delete:
      summary: Xoa loai ve
      description: "UC14. Role yeu cau: organizer hoac admin."
      tags: [Organizer]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/EventIdPath"
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Xoa loai ve thanh cong
        "400":
          description: Path parameter khong hop le
        "401":
          description: Chua dang nhap
        "403":
          description: Khong co quyen Organizer
        "404":
          description: Khong tim thay loai ve
        "500":
          description: Loi he thong

  /registrations:
    post:
      summary: Dang ky tham du su kien
      description: "UC07 alternative endpoint. Role yeu cau: attendee. Cung controller voi POST /tickets/register."
      tags: [Tickets]
      security:
        - bearerAuth: []
      requestBody:
        $ref: "#/components/requestBodies/RegisterAttendance"
      responses:
        "201":
          description: Dang ky ve su kien thanh cong
        "400":
          description: Du lieu dau vao khong hop le hoac su kien khong cho dang ky
        "401":
          description: Chua dang nhap
        "403":
          description: Khong co quyen Attendee
        "404":
          description: Khong tim thay su kien hoac loai ve
        "409":
          description: Dang ky da ton tai hoac trang thai xung dot
        "500":
          description: Loi he thong

  /tickets/register:
    post:
      summary: Dang ky tham du su kien
      description: "UC07. Role yeu cau: attendee."
      tags: [Tickets]
      security:
        - bearerAuth: []
      requestBody:
        $ref: "#/components/requestBodies/RegisterAttendance"
      responses:
        "201":
          description: Dang ky ve su kien thanh cong
        "400":
          description: Du lieu dau vao khong hop le hoac su kien khong cho dang ky
        "401":
          description: Chua dang nhap
        "403":
          description: Khong co quyen Attendee
        "404":
          description: Khong tim thay su kien hoac loai ve
        "409":
          description: Dang ky da ton tai hoac trang thai xung dot
        "500":
          description: Loi he thong

  /tickets:
    get:
      summary: Xem lich su tham du
      description: "UC12. Role yeu cau: attendee."
      tags: [Tickets]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Lay lich su ve thanh cong
        "401":
          description: Chua dang nhap
        "403":
          description: Khong co quyen Attendee
        "500":
          description: Loi he thong

  /tickets/{id}:
    get:
      summary: Xem chi tiet ve
      description: "UC09. Role yeu cau: attendee. Attendee chi xem ve cua minh."
      tags: [Tickets]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Lay chi tiet ve thanh cong
        "400":
          description: Path parameter khong hop le
        "401":
          description: Chua dang nhap
        "403":
          description: Khong co quyen Attendee hoac khong phai chu ve
        "404":
          description: Khong tim thay ve
        "500":
          description: Loi he thong

  /tickets/{id}/calendar:
    post:
      summary: Them ve vao Google Calendar
      description: "UC10 placeholder trong source. Endpoint hien chi tra message stub `UC10 - Add to Google Calendar (OAuth2)` va chua co middleware auth."
