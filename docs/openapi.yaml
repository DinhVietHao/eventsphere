components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Nhap accessToken tu API login. Swagger UI se tu them prefix Bearer.

  parameters:
    Page:
      in: query
      name: page
      schema:
        type: integer
        minimum: 1
        default: 1
      description: Trang hien tai
    Limit:
      in: query
      name: limit
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
      description: So ban ghi moi trang
    IdPath:
      in: path
      name: id
      required: true
      schema:
        $ref: "#/components/schemas/ObjectId"
      description: MongoDB ObjectId theo router `:id`
    EventIdPath:
      in: path
      name: eventId
      required: true
      schema:
        $ref: "#/components/schemas/ObjectId"
      description: MongoDB ObjectId cua su kien
    UserIdPath:
      in: path
      name: userId
      required: true
      schema:
        $ref: "#/components/schemas/ObjectId"
      description: MongoDB ObjectId cua tai khoan

  requestBodies:
    RegisterAttendance:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [eventId, ticketTypeId]
            properties:
              eventId:
                $ref: "#/components/schemas/ObjectId"
              ticketTypeId:
                $ref: "#/components/schemas/ObjectId"
          example:
            eventId: "6a605f96aca87f236e645edc"
            ticketTypeId: "6a605f96aca87f236e645ee7"

  schemas:
    ObjectId:
      type: string
      pattern: "^[a-fA-F0-9]{24}$"
      example: "6a605f96aca87f236e645edc"

    ApiResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          nullable: true
        error:
          nullable: true

    RegisterBody:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 50
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6
          maxLength: 30
          format: password
        role:
          type: string
          enum: [attendee, organizer, staff, admin]
          default: attendee
        phone:
          type: string
          nullable: true

    LoginBody:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    UpdateProfileBody:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 50
        phone:
          type: string
          pattern: "^0[0-9]{9}$"
          nullable: true
        avatar:
          type: string
          format: uri
          nullable: true

    ChangePasswordBody:
      type: object
      required: [currentPassword, newPassword, confirmPassword]
      properties:
        currentPassword:
          type: string
          format: password
        newPassword:
          type: string
          minLength: 6
          maxLength: 30
          format: password
        confirmPassword:
          type: string
          format: password

    CreateEventBody:
      type: object
      required: [title, description, category, location, startDate, endDate]
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 100
        description:
          type: string
          minLength: 10
        category:
          type: string
          enum: [music, tech, sport, education]
        location:
          type: string
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        bannerUrl:
          type: string
          maxLength: 2048
          nullable: true
        actionType:
          type: string
          enum: [draft, submit]
          default: draft

    CreateEventMultipartBody:
      type: object
      required: [title, description, category, location, startDate, endDate]
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 100
        description:
          type: string
          minLength: 10
        category:
          type: string
          enum: [music, tech, sport, education]
        location:
          type: string
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        actionType:
          type: string
          enum: [draft, submit]
          default: draft
        banner:
          type: string
          format: binary

    UpdateEventBody:
      type: object
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 100
        description:
          type: string
          minLength: 10
        category:
          type: string
          enum: [music, tech, sport, education]
        location:
          type: string
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        bannerUrl:
          type: string
          maxLength: 2048
          nullable: true

    UpdateEventMultipartBody:
      type: object
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 100
        description:
          type: string
          minLength: 10
        category:
          type: string
          enum: [music, tech, sport, education]
        location:
          type: string
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        banner:
          type: string
          format: binary

    TicketTypeBody:
      type: object
      required: [name, price, quota]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 50
        price:
          type: number
          minimum: 0
        quota:
          type: integer
          minimum: 1
        description:
          type: string
          nullable: true

    UpdateTicketTypeBody:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 50
        price:
          type: number
          minimum: 0
        quota:
          type: integer
          minimum: 1
        description:
          type: string
          nullable: true

    ReviewBody:
      type: object
      required: [eventId, rating]
      properties:
        eventId:
          $ref: "#/components/schemas/ObjectId"
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
          maxLength: 500
          nullable: true

    NotificationBody:
      type: object
      required: [eventId, subject, message]
      properties:
        eventId:
          $ref: "#/components/schemas/ObjectId"
        subject:
          type: string
          minLength: 1
          maxLength: 200
        message:
          type: string
          minLength: 1
          maxLength: 2000

    QrCheckinBody:
      type: object
      required: [registrationId, eventId, timestamp]
      properties:
        registrationId:
          $ref: "#/components/schemas/ObjectId"
        eventId:
          $ref: "#/components/schemas/ObjectId"
        timestamp:
          type: integer
          minimum: 1

    ManualCheckinBody:
      type: object
      required: [registrationId, eventId]
      properties:
        registrationId:
          $ref: "#/components/schemas/ObjectId"
        eventId:
          $ref: "#/components/schemas/ObjectId"
        timestamp:
          type: integer
          minimum: 1
